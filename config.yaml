# ==============================================================================
# INTELLIGENT CYBER THREAT DETECTION & NETWORK TRAFFIC ANALYSIS
# Configuration Specification - CIC-IDS2017 Benchmark & ML Pipeline
# ==============================================================================

project:
  name: "Cyber_Threat_Detection"
  title: "Intelligent Cyber Threat Detection & Network Traffic Analysis"
  version: "1.0.0"
  author: "Cybersecurity & Data Science Research Project"
  description: "End-to-end Machine Learning and Network Traffic Analysis platform using CIC-IDS2017"
  environment: "development" # options: development, production, test

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  sample_data_dir: "data/sample"
  saved_models_dir: "models/saved_models"
  model_metadata_dir: "models/model_metadata"
  reports_figures_dir: "reports/figures"
  reports_results_dir: "reports/results"
  reports_dir: "reports"
  docs_dir: "docs"

dataset:
  name: "CIC-IDS2017"
  official_url: "https://www.unb.ca/cic/datasets/ids-2017.html"
  publisher: "Canadian Institute for Cybersecurity (CIC), University of New Brunswick"
  raw_files:
    - "Monday-WorkingHours.pcap_ISCX.csv"
    - "Tuesday-WorkingHours.pcap_ISCX.csv"
    - "Wednesday-workingHours.pcap_ISCX.csv"
    - "Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv"
    - "Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv"
    - "Friday-WorkingHours-Morning.pcap_ISCX.csv"
    - "Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv"
    - "Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv"
  target_column: "Label"
  binary_target_column: "Binary_Label"
  benign_label: "BENIGN"
  attack_label: "ATTACK"
  # Potentially leakage-prone or identifier features to strip for defensible generalization
  leakage_features:
    - "Flow ID"
    - "Source IP"
    - "Destination IP"
    - "Timestamp"
    - "Source Port"
    - "Destination Port"
    - "External IP"
    - "Unnamed: 0"
    - "id"

sampling:
  enabled_for_dev: true
  dev_sample_fraction: 0.10
  dev_max_rows: 50000
  random_state: 42
  stratify: true

preprocessing:
  imputation_strategy: "median" # 'mean', 'median', 'constant'
  scaler: "StandardScaler" # 'StandardScaler', 'RobustScaler', 'MinMaxScaler'
  remove_duplicates: true
  remove_infinite: true
  infinite_replacement: "nan_then_impute" # replace inf with nan then impute
  drop_constant_columns: true
  constant_variance_threshold: 0.0
  outlier_clipping: true
  outlier_lower_quantile: 0.001
  outlier_upper_quantile: 0.999

feature_engineering:
  add_ratio_features: true
  add_flow_rate_aggregates: true
  add_packet_size_dispersion: true
  feature_selection:
    enabled: true
    method: "random_forest_importance" # 'mutual_info', 'random_forest_importance', 'none'
    top_k_features: 30

models:
  random_state: 42
  test_size: 0.25
  stratified_split: true

  logistic_regression:
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"
    random_state: 42

  decision_tree:
    criterion: "gini"
    max_depth: 15
    min_samples_split: 10
    min_samples_leaf: 5
    class_weight: "balanced"
    random_state: 42

  random_forest:
    n_estimators: 100
    max_depth: 20
    min_samples_split: 8
    min_samples_leaf: 4
    class_weight: "balanced"
    n_jobs: -1
    random_state: 42

  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    subsample: 0.8
    random_state: 42

  xgboost:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    eval_metric: "logloss"
    random_state: 42

  isolation_forest:
    n_estimators: 150
    contamination: 0.15 # estimated proportion of anomalous traffic
    max_samples: "auto"
    n_jobs: -1
    random_state: 42

evaluation:
  selection_metric: "macro_f1" # Primary metric for imbalanced cybersecurity evaluations
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "macro_f1"
    - "weighted_f1"
    - "false_positive_rate"
    - "false_negative_rate"
    - "roc_auc"
    - "pr_auc"
    - "training_time_sec"
    - "inference_time_sec"

explainability:
  top_features_display: 20
  permutation_importance_n_repeats: 5
  shap_sample_size: 100

dashboard:
  theme: "dark_soc"
  page_title: "CyberPulse - Intelligent Threat Detection SOC"
  layout: "wide"
  cache_ttl_seconds: 3600
  max_upload_size_mb: 50

